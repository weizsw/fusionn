# ════════════════════════════════════════════════════════════════════════════
# FUSIONN CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════
# Intelligent Media Automation Platform

server:
  port: 8080

# ════════════════════════════════════════════════════════════════════════════
# SUBTITLE MERGING (Sonarr/Radarr Integration)
# ════════════════════════════════════════════════════════════════════════════
subtitle:
  enabled: false # Set to true to enable subtitle merging

  # DuoSubs settings for semantic subtitle alignment
  duosubs:
    mode: "local"  # "local" or "http"
                   # - "local": Execute duosubs binary in container (CPU-only on macOS Docker)
                   # - "http": Call duosubs-service on host (enables Metal GPU on macOS)
    
    model: "sentence-transformers/LaBSE" # Multilingual embedding model (~2GB)
                                          # Leave empty ("") to use DuoSubs default (LaBSE)
                                          # First run downloads model to HuggingFace cache
    device: "auto" # "auto", "cuda", "cpu" (only applies to local mode)
    timeout_minutes: 10
    
    # HTTP mode settings (required if mode: "http")
    http_url: "http://host.docker.internal:8765"  # URL to duosubs-service on host
    http_container_prefix: "/data"                # Container path prefix (where media is mounted in container)
    http_host_prefix: "/Users/you/media"          # Host path prefix (actual media location on your Mac)
                                                   # These MUST match your Docker volume mount!

  # Output: save merged subtitle to same directory as video file
  output_same_dir: true

  # Language code variants for subtitle detection
  english_variants: ["eng", "en", "eng-us"]
  chinese_variants: ["chi", "zho", "zh-hans", "zh-cn", "zh", "zh-tw", "zh-hk"]

  # Title keywords for Chinese subtitle type detection (case-insensitive)
  simplified_keywords: ["simplified", "简体", "简中", "chs", "singapore"]
  traditional_keywords:
    ["traditional", "繁体", "繁中", "cht", "taiwan", "hong kong"]

  # OpenCC: Traditional → Simplified Chinese conversion
  opencc:
    enabled: true
    config: "t2s.json"

  # ASS styling: Custom visual appearance for merged subtitles
  ass_style:
    enabled: true
    primary_font: "WenQuanYi Micro Hei" # Font for Chinese (primary line)
    primary_size: 20 # Font size for Chinese
    primary_color: "&H00c8c8c8" # Color for Chinese (ASS format: &HAABBGGRR)
    secondary_font: "WenQuanYi Micro Hei" # Font for English (secondary line)
    secondary_size: 13 # Font size for English
    secondary_color: "&H0010b8ff" # Color for English (orange)
    bold: true # Bold text
    outline: 0.5 # Outline width
    shadow: 0.5 # Shadow depth
    margin_v: 5 # Reference bottom margin for 16:9 video; adjusted for wider media
    margin_left: 10 # Left margin (pixels from left edge)
    margin_right: 10 # Right margin (pixels from right edge)
    alignment: 2 # Subtitle position (1-9 numpad layout: 1=bottom-left, 2=bottom-center, 3=bottom-right, 4=middle-left, 5=center, 6=middle-right, 7=top-left, 8=top-center, 9=top-right)
    border_style: 1 # Border rendering: 1=outline+shadow (default), 3=opaque box
    wrap_style: "0" # Line wrapping: 0=smart wrap (top wider), 1=end-of-line, 2=no wrap, 3=smart wrap (bottom wider)

  # Font embedding: Automatically embed fonts into ASS subtitle files
  font_embedding:
    enabled: false # Set to true to enable font embedding
    fonts_dir: "/app/fonts" # Directory containing font files (TTF/OTF)
                             # Mount via Docker: -v ./fonts:/app/fonts
    timeout_seconds: 300 # Timeout for font embedding operation (5 minutes)

# Redis connection (for translation queue to fusionn-subs)
redis:
  host: "redis"
  port: 6379
  password: ""
  database: 0
  queue_key: "fusionn:translation:queue"

# Apprise notifications (success/failure alerts)
apprise:
  enabled: false # Set to true to enable notifications
  base_url: "http://apprise:8000"
  key: "apprise"
  tag: "fusionn-subtitle"

# Job queue settings (for subtitle merging)
queue:
  workers: 1 # Number of concurrent merge workers (1 = sequential, 2+ = parallel)
  queue_size: 100 # Max pending jobs in queue
  max_retries: 3 # Max retry attempts for failed jobs

# Bazarr integration (search for Chinese subtitles before translating)
bazarr:
  enabled: false
  url: "http://bazarr:6767"
  api_key: ""
  search_timeout: 180          # seconds — max time for Bazarr PATCH request
  language_code: "zh"          # Bazarr language code for Chinese subtitles
  poll_interval_seconds: 5     # seconds — how often to poll Bazarr after triggering search
  poll_timeout_seconds: 60     # seconds — max time to wait for Bazarr to download subtitle

# ════════════════════════════════════════════════════════════════════════════
# DOCKER SETUP
# ════════════════════════════════════════════════════════════════════════════
#
# docker run -d \
#   -p 8080:8080 \
#   -v ./config.yaml:/app/config/config.yaml:ro \
#   -v ./data:/data \
#   -v /path/to/media:/media \
#   -v huggingface-cache:/root/.cache/huggingface \
#   fusionn
#
# ════════════════════════════════════════════════════════════════════════════
# DUOSUBS MODEL CACHING (Docker)
# ════════════════════════════════════════════════════════════════════════════
#
# DuoSubs downloads sentence-transformer models from HuggingFace (~2GB for LaBSE).
# To persist models across container restarts, mount the HuggingFace cache:
#
# In docker-compose.yaml:
#   volumes:
#     - huggingface-cache:/root/.cache/huggingface
#
#   volumes:
#     huggingface-cache:
#
# **First Run Behavior:**
# - Downloads LaBSE model (~2GB, takes 5-10 minutes)
# - Stores in /root/.cache/huggingface inside container
#
# **Subsequent Runs:**
# - Uses cached model (instant startup)
# - No re-download needed
#
# **Custom Cache Directory:**
# To use a host directory instead of Docker volume:
#   volumes:
#     - /path/to/custom/cache:/root/.cache/huggingface
#
# ════════════════════════════════════════════════════════════════════════════
# API ENDPOINTS
# ════════════════════════════════════════════════════════════════════════════
#
# GET  /health                          - Health check
# GET  /api/v1/status                   - Application status
# POST /api/v1/webhook/sonarr           - Sonarr import webhook
# POST /api/v1/webhook/radarr           - Radarr import webhook
# POST /api/v1/callback/translation     - Translation completion callback
#
# ════════════════════════════════════════════════════════════════════════════

