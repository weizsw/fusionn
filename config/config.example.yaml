# ════════════════════════════════════════════════════════════════════════════
# FUSIONN CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════
# Intelligent Media Automation Platform

# Log level: DEBUG, INFO, WARN or ERROR. It overrides LOG_LEVEL and takes
# effect within 10 seconds of saving this file, without a restart. Leave it
# empty to use LOG_LEVEL (default INFO).
log_level: ""

server:
  port: 8080

# ════════════════════════════════════════════════════════════════════════════
# SUBTITLE MERGING (Sonarr/Radarr Integration)
# ════════════════════════════════════════════════════════════════════════════
subtitle:
  enabled: false # Set to true to enable subtitle merging

  # Merge engine:
  # - "llm": native Go ID-mapping merge (Chinese line above English; model only
  #          returns subtitle ID links, text is always copied from the sources)
  # - "duosubs": legacy DuoSubs semantic aligner
  # Omit this key in an existing config to keep "duosubs" when a duosubs section
  # is present; brand-new configs default to "llm".
  engine: "llm"

  # LLM engine settings (used when engine: "llm")
  llm:
    # OpenAI-compatible base URL, e.g. http://127.0.0.1:3425/v1
    # Inside Docker, localhost is the container: use a reachable host name/IP.
    base_url: "http://127.0.0.1:3425/v1"
    model: "group/flash-models"

    # Authentication: prefer api_key_env so the secret stays out of this file.
    # api_key_env names an environment variable and takes precedence over api_key.
    api_key: ""
    api_key_env: "" # e.g. "FUSIONN_SUBTITLE_LLM_API_KEY"
    # Default "low": shorter reasoning and faster answers. Set "" to omit the
    # parameter for models that reject it.
    reasoning_effort: "low" # e.g. "low", "medium", "high"
    response_format: "json_object" # "json_object", "json_schema", or "none"
    timeout_seconds: 300
    # Optional output token cap per window, reasoning included. 0 (default)
    # omits the parameter so the provider default applies. A window that hits
    # the cap fails with finish_reason "length" and falls back to timing-only
    # pairing; reasoning models can need more than 16000.
    max_tokens: 0

    # Concurrent window requests and per-request retries (0 = no retry).
    workers: 3
    retries: 1

    # Sliding alignment windows (seconds) with adjacent-window context overlap.
    window_seconds: 210
    overlap_seconds: 15

    # Request cache. Cache keys include source subtitles, model, prompt, and
    # alignment settings; changing only styles reuses the cached ID mapping.
    # Must be a persistent path outside temp merge directories.
    cache_enabled: true
    cache_dir: "/data/llm-subtitle-cache"
    # Optional: reuse a precomputed ID-mapping JSON instead of requesting a model.
    mapping_path: ""

    # Display limits also constrain short joins. Long source cues use time slices.
    en_chars: 65    # target English characters per displayed fragment (punctuation does not count)
    zh_chars: 20    # target Chinese characters (punctuation does not count); omitted values default to 25
    en_gap_ms: 400  # max English gap to join sentences
    zh_gap_ms: 500  # max Chinese gap to join sentences
    span_ms: 5500   # max joined speech span
    fill_gap_ms: 500 # fill positive gaps up to this value between slices

    # Optional CPU word-alignment service. Empty uses proportional timing.
    # Docker Compose supplies http://word-align:8767 through the environment.
    word_align_url: ""

  # DuoSubs settings for semantic subtitle alignment
  # Only validated and used when engine: "duosubs".
  duosubs:
    mode: "local"  # "local" or "http"
                   # - "local": Execute duosubs binary in container (CPU-only on macOS Docker)
                   # - "http": Call duosubs-service on host (enables Metal GPU on macOS)

    model: "sentence-transformers/LaBSE" # Multilingual embedding model (~2GB)
                                          # Leave empty ("") to use DuoSubs default (LaBSE)
                                          # First run downloads model to HuggingFace cache
    device: "auto" # "auto", "cuda", "cpu" (only applies to local mode)
    timeout_minutes: 10

    # HTTP mode settings (required if mode: "http")
    http_url: "http://host.docker.internal:8765"  # URL to duosubs-service on host
    http_container_prefix: "/data"                # Container path prefix (where media is mounted in container)
    http_host_prefix: "/Users/you/media"          # Host path prefix (actual media location on your Mac)
                                                   # These MUST match your Docker volume mount!

  # Output: save merged subtitle to same directory as video file
  output_same_dir: true

  # Language code variants for subtitle detection
  english_variants: ["eng", "en", "eng-us"]
  chinese_variants: ["chi", "zho", "zh-hans", "zh-cn", "zh", "zh-tw", "zh-hk"]

  # Title keywords for Chinese subtitle type detection (case-insensitive)
  simplified_keywords: ["simplified", "简体", "简中", "chs", "singapore"]
  traditional_keywords:
    ["traditional", "繁体", "繁中", "cht", "taiwan", "hong kong"]

  # OpenCC: Traditional → Simplified Chinese conversion
  opencc:
    enabled: true
    config: "t2s.json"

  # ASS styling: shared by both engines.
  # Values use play_res_x x play_res_y script coordinates. Defaults target a
  # 1920x1080 canvas; the processor keeps the same relative size and bottom
  # distance on a centered 16:9 playback canvas, including player letterbox bars.
  #
  # MIGRATION: configs written before play_res_x/play_res_y existed used a
  # 384x288 canvas. If play_res_y is omitted, explicit primary_size,
  # secondary_size, margin_v, outline, and shadow values are scaled by
  # play_res_y/288 (3.75 for 1080p); margin_left and margin_right scale by
  # play_res_x/384 (5 for 1920). Explicit zeros and booleans are preserved.
  # Set play_res_y explicitly to opt out.
  ass_style:
    enabled: true # Defaults to true; explicit false disables style injection
    play_res_x: 1920 # ASS script canvas width
    play_res_y: 1080 # ASS script canvas height
    primary_font: "PingFang SC" # Font for Chinese (primary line)
    primary_size: 52 # Chinese font size in script coordinates
    primary_color: "&H08EFECEA" # Soft mist white (ASS: &HAABBGGRR)
    secondary_font: "Helvetica Neue" # Font for English (secondary line)
    secondary_size: 36 # English font size in script coordinates
    secondary_color: "&H087BC0E5" # Warm apricot gold (ASS: &HAABBGGRR)
    bold: false # Bold text
    outline: 1.4 # Outline width in script coordinates
    outline_color: "&H30141414" # Dark charcoal, ~81% opaque
    shadow: 1.5 # Shadow depth in script coordinates
    back_color: "&H80000000" # 50% transparent black
    margin_v: 32 # Bottom margin in script coordinates
    margin_left: 80 # Left margin in script coordinates
    margin_right: 80 # Right margin in script coordinates
    alignment: 2 # Subtitle position (1-9 numpad layout: 1=bottom-left, 2=bottom-center, 3=bottom-right, 4=middle-left, 5=center, 6=middle-right, 7=top-left, 8=top-center, 9=top-right)
    border_style: 1 # Border rendering: 1=outline+shadow (default), 3=opaque box
    wrap_style: "0" # Line wrapping: 0=smart wrap (top wider), 1=end-of-line, 2=no wrap, 3=smart wrap (bottom wider)
    scale_x: 100 # Horizontal glyph scale (percent)
    spacing: 0 # Extra letter spacing in script coordinates
    line_height_ratio: 1.23 # Line height as a multiple of font size
    block_padding: 16 # Vertical padding inside a bilingual subtitle block
    collision_gap: 12 # Minimum vertical gap between independently positioned blocks

  # Font embedding: Automatically embed fonts into ASS subtitle files
  font_embedding:
    enabled: false # Set to true to enable font embedding
    fonts_dir: "/app/fonts" # Directory containing font files (TTF/OTF)
                             # Mount via Docker: -v ./fonts:/app/fonts
    timeout_seconds: 300 # Timeout for font embedding operation (5 minutes)

# Redis connection (for translation queue to fusionn-subs)
redis:
  host: "redis"
  port: 6379
  password: ""
  database: 0
  queue_key: "fusionn:translation:queue"

# Apprise notifications (success/failure alerts)
apprise:
  enabled: false # Set to true to enable notifications
  base_url: "http://apprise:8000"
  key: "apprise"
  tag: "fusionn-subtitle"

# Job queue settings (for subtitle merging)
queue:
  workers: 1 # Number of concurrent merge workers (1 = sequential, 2+ = parallel)
  queue_size: 100 # Max pending jobs in queue
  max_retries: 3 # Max retry attempts for failed jobs

# Bazarr integration (search for Chinese subtitles before translating)
bazarr:
  enabled: false
  url: "http://bazarr:6767"
  api_key: ""
  search_timeout: 180          # seconds — max time for Bazarr PATCH request
  language_code: "zh"          # Bazarr language code for Chinese subtitles
  poll_interval_seconds: 5     # seconds — how often to poll Bazarr after triggering search
  poll_timeout_seconds: 60     # seconds — max time to wait for Bazarr to download subtitle

# ════════════════════════════════════════════════════════════════════════════
# DOCKER SETUP
# ════════════════════════════════════════════════════════════════════════════
#
# docker run -d \
#   -p 8080:8080 \
#   -v ./config.yaml:/app/config/config.yaml:ro \
#   -v ./data:/data \
#   -v /path/to/media:/media \
#   -v huggingface-cache:/root/.cache/huggingface \
#   fusionn
#
# ════════════════════════════════════════════════════════════════════════════
# DUOSUBS MODEL CACHING (Docker)
# ════════════════════════════════════════════════════════════════════════════
#
# DuoSubs downloads sentence-transformer models from HuggingFace (~2GB for LaBSE).
# To persist models across container restarts, mount the HuggingFace cache:
#
# In docker-compose.yaml:
#   volumes:
#     - huggingface-cache:/root/.cache/huggingface
#
#   volumes:
#     huggingface-cache:
#
# **First Run Behavior:**
# - Downloads LaBSE model (~2GB, takes 5-10 minutes)
# - Stores in /root/.cache/huggingface inside container
#
# **Subsequent Runs:**
# - Uses cached model (instant startup)
# - No re-download needed
#
# **Custom Cache Directory:**
# To use a host directory instead of Docker volume:
#   volumes:
#     - /path/to/custom/cache:/root/.cache/huggingface
#
# ════════════════════════════════════════════════════════════════════════════
# API ENDPOINTS
# ════════════════════════════════════════════════════════════════════════════
#
# GET  /health                          - Health check
# GET  /api/v1/status                   - Application status
# POST /api/v1/webhook/sonarr           - Sonarr import webhook
# POST /api/v1/webhook/radarr           - Radarr import webhook
# POST /api/v1/callback/translation     - Translation completion callback
#
# ════════════════════════════════════════════════════════════════════════════
